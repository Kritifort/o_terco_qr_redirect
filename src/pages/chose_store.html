<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Acesse o App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #141414;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            height: 100%;
            width: 100%;
            padding: 20px;
        }

        .logo {
            max-width: 200px;
            margin-top: 40px;
        }

        .buttons {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .store-button {
            transition: background-color 0.3s ease;
            width: 200px;
            height: 70px;
            padding: 0;
            border: none;
            background: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: .2s;
        }

        .store-button:hover {
            transform: scale(1.1);
        }

        .text {
            color: #fff;
            font-size: 18px;
            margin-top: 20px;
        }

        .em-breve {
            color: #fff;
            font-size: 16px;
            margin-top: 8px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }
    </style>
    <script>
        // URLs dos botões
        const googlePlayUrl = "https://play.google.com/store/apps/details?id=com.kritifort.ar.oterco";
        const appStoreUrl = "https://apps.apple.com/app/id1234567890";
    </script>
</head>

<body>
    <div class="container">
        <!-- Substitua o src abaixo pela URL real do logo -->
        <img src="../assets/logo.png" alt="Logo do App" class="logo">

        <p class="text">Escolha sua loja de aplicativos:</p>

        <div class="buttons">
            <button class="store-button" onclick="window.location.href=googlePlayUrl;">
                <img src="../assets/GooglePlayButton.png" alt="Google Play"
                    style="width:100%; height:100%; object-fit:contain;">
            </button>
            <div style="display: flex; flex-direction: column; align-items: center;">
                <button class="store-button">
                    <img src="../assets/AppStoreButton.svg" alt="App Store"
                        style="width:100%; height:100%; object-fit:contain;">
                </button>
                <span class="em-breve">EM BREVE</span>
            </div>
        </div>
    </div>
</body>

</html>
